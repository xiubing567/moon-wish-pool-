<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>月球计划 · 未风化的许愿池</title><meta name="description" content="转动月球，选一个坐标，留下一条愿望。"><link rel="stylesheet" href="style.css"></head><body>
<header><div><h1 data-copy="0">月球计划</h1><span data-copy="1">未风化的许愿池</span></div><nav class="header-actions"><a class="guide-entry" id="guide-entry" href="guide.html">动画导览 ↗</a><button id="language" type="button" aria-label="Switch to English">EN</button><button id="aboutBtn" data-copy="2">关于项目 ↗</button></nav></header>
<main><section class="map" aria-label="月球愿望地图"><div class="eyebrow"><span data-copy="3">月面档案</span> <span id="count"></span></div><div id="globe"><canvas id="moon" width="480" height="480" tabindex="0" aria-label="拖动或按方向键转动月球"></canvas><div id="pins"></div><div id="wishTrail" aria-hidden="true"></div><div class="cross">＋</div></div><button id="scout" class="scout" type="button" aria-label="跟月面巡查员读一条愿望"><span class="moon-girl" aria-hidden="true"></span></button><p class="hint" data-copy="4">↶　拖动月球，选中经纬度　↷</p><div class="nav"><button id="shower" type="button" aria-pressed="false" aria-label="让愿望落下来">✧</button><button id="prev" aria-label="上一条愿望">←</button><span id="navLabel"></span><button id="next" aria-label="下一条愿望">→</button></div></section>
<aside><article class="paper" id="reader"><div class="card-head"><h2 id="number"></h2></div><div id="meta" class="muted"></div><div class="reading"><img id="picture" alt=""><div><p id="original"></p><button id="translate" aria-expanded="false">翻译</button><p id="translated" hidden></p></div></div> </article>
<form class="paper" id="form"><div class="card-head"><h2 data-copy="5">我的愿望</h2><span data-copy="6">月面选点</span></div><output id="coords"></output><textarea id="wish" maxlength="500" required placeholder="用你自己的语言写一个愿望" aria-label="愿望"></textarea><details class="translation-field"><summary id="addTranslation">补充中英文译文（选填）</summary><textarea id="wishTranslation" maxlength="500" aria-label="译文" placeholder="可以附上另一种语言的版本"></textarea></details><div class="fields"><input id="signature" maxlength="40" placeholder="署名（选填）" aria-label="署名"><label class="upload"><span data-copy="7">＋ 上传照片</span><input type="file" id="photo" accept="image/jpeg,image/png,image/webp,image/gif"></label></div><div id="attachment" hidden><img id="preview" alt="待上传的照片"><button id="removePhoto" type="button" data-copy="8">移除照片</button></div><div class="submit"><small data-copy="9">时间自动记录</small><button class="red" type="submit" data-copy="10">刻在这里</button></div><div id="status" role="status"></div></form></aside></main>
<footer><span data-copy="0">月球计划</span> <span>·</span> <span data-copy="11">每个红点，一条愿望。</span> </footer>
<dialog id="about"><h2 data-copy="1">未风化的许愿池</h2><p data-copy="12">拖动月球，用中央的十字选一个月面坐标。也可以点开红点，看看那里留下了什么。</p><p data-copy="13">月球上的红点各有一条愿望。你的愿望和照片保存在当前浏览器。</p><form method="dialog"><button data-copy="14">关闭</button></form></dialog><script src="app.js" type="module"></script></body></html>
